openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Career Scout API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: User profile management
  - name: postings
    description: Job posting management
  - name: matchReports
    description: Match report retrieval
  - name: dashboard
    description: Dashboard summary data
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: gmail
    description: Gmail OAuth connection and inbox sync
  - name: onlineDiscovery
    description: Profile-matched online job discovery
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get user profile
      description: Returns the current user's career profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertProfile
      tags: [profile]
      summary: Create or update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /postings:
    get:
      operationId: listPostings
      tags: [postings]
      summary: List job postings
      description: Returns job postings for the current user, with optional filtering
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search term to filter by title or company
        - name: minFitScore
          in: query
          schema:
            type: integer
          description: Minimum fit score filter
        - name: source
          in: query
          schema:
            type: string
          description: Filter by source (manual, gmail)
        - name: applied
          in: query
          schema:
            type: boolean
        - name: hidden
          in: query
          schema:
            type: boolean
          description: Filter by applied status
      responses:
        "200":
          description: List of job postings with match reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostingWithReport"
    post:
      operationId: createPosting
      tags: [postings]
      summary: Create a job posting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostingBody"
      responses:
        "201":
          description: Created posting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPosting"

  /postings/deleted:
    get:
      operationId: listDeletedPostings
      tags: [postings]
      summary: List deleted job postings
      responses:
        "200":
          description: List of deleted postings with match reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostingWithReport"

  /postings/{id}:
    get:
      operationId: getPosting
      tags: [postings]
      summary: Get a job posting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job posting with match report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostingWithReport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePosting
      tags: [postings]
      summary: Delete a job posting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /postings/{id}/restore:
    patch:
      operationId: restorePosting
      tags: [postings]
      summary: Restore a deleted job posting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored posting id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                required: [id]
        "404":
          description: Not found

  /postings/{id}/close:
    post:
      operationId: closePosting
      tags: [postings]
      summary: Mark a posting as closed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Closed

  /postings/{id}/reopen:
    patch:
      operationId: reopenPosting
      tags: [postings]
      summary: Reopen a closed posting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reopened posting id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                required: [id]

  /postings/{id}/applied:
    patch:
      operationId: markApplied
      tags: [postings]
      summary: Toggle applied status on a posting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated applied status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAppliedResult"
        "404":
          description: Not found

  /postings/export.csv:
    get:
      operationId: exportPostingsCsv
      tags: [postings]
      summary: Export job postings as CSV
      description: Downloads all active job postings for the current user as a CSV file
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary

  /postings/import:
    post:
      operationId: importPostingsCsv
      tags: [postings]
      summary: Import job postings from CSV
      description: Parses a CSV file and inserts valid job postings, skipping duplicates and invalid rows
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportSummary"
        "400":
          description: No file uploaded or invalid CSV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /postings/{id}/analyze:
    post:
      operationId: analyzePosting
      tags: [postings]
      summary: Trigger AI analysis of a job posting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated match report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchReport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /online-discovery/status:
    get:
      operationId: getOnlineDiscoveryStatus
      tags: [onlineDiscovery]
      summary: Get online job discovery status
      responses:
        "200":
          description: Current discovery configuration and the latest run status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineDiscoveryStatus"

  /online-discovery/run:
    post:
      operationId: runOnlineDiscovery
      tags: [onlineDiscovery]
      summary: Find new online job opportunities matched to the current profile
      responses:
        "200":
          description: Discovery run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineDiscoveryRunResult"
        "400":
          description: Profile needs experience or skills before discovery can run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /online-discovery/settings:
    put:
      operationId: updateOnlineDiscoverySettings
      tags: [onlineDiscovery]
      summary: Update online job discovery settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnlineDiscoverySettings"
      responses:
        "200":
          description: Updated discovery status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineDiscoveryStatus"

  /online-discovery/sources:
    get:
      operationId: getOnlineDiscoverySources
      tags: [onlineDiscovery]
      summary: List configured and available online job sources
      responses:
        "200":
          description: Online job source configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineDiscoverySourcesResponse"
    post:
      operationId: createOnlineDiscoverySource
      tags: [onlineDiscovery]
      summary: Add a built-in or custom online job source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnlineDiscoverySourceInput"
      responses:
        "201":
          description: Added online job source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineDiscoverySource"
        "400":
          description: Invalid or unsupported source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Source is already configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /online-discovery/sources/{id}:
    patch:
      operationId: updateOnlineDiscoverySource
      tags: [onlineDiscovery]
      summary: Suppress or restore an online job source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnlineDiscoverySourceUpdate"
      responses:
        "200":
          description: Updated online job source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineDiscoverySource"
        "404":
          description: Source not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteOnlineDiscoverySource
      tags: [onlineDiscovery]
      summary: Remove an online job source configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Source configuration removed
        "404":
          description: Source not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /filter-stats:
    get:
      operationId: getFilterStats
      tags: [postings]
      summary: Get dashboard and sync filtering metrics
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Filtering metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterStats"

  /filtered-emails:
    get:
      operationId: listFilteredEmails
      tags: [gmail]
      summary: List emails skipped during inbox processing
      responses:
        "200":
          description: Skipped emails
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FilteredEmail"

  /email-sync-log:
    get:
      operationId: listEmailSyncLog
      tags: [gmail]
      summary: List Gmail processing history
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: sender
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Gmail processing history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmailSyncLogItem"

  /match-reports:
    get:
      operationId: listMatchReports
      tags: [matchReports]
      summary: List match reports for current user
      responses:
        "200":
          description: List of match reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchReport"

  /match-reports/{id}:
    get:
      operationId: getMatchReport
      tags: [matchReports]
      summary: Get a match report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchReport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /filter-settings:
    get:
      operationId: getFilterSettings
      tags: [gmail]
      summary: Get email filter settings
      responses:
        "200":
          description: Email filter settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailFilterSettings"
    put:
      operationId: updateFilterSettings
      tags: [gmail]
      summary: Update email filter settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailFilterSettings"
      responses:
        "200":
          description: Updated filter settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailFilterSettings"

  /company-filter-settings:
    get:
      operationId: getCompanyFilterSettings
      tags: [profile]
      summary: Get company filter settings
      responses:
        "200":
          description: Company filter settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyFilterSettings"
    put:
      operationId: updateCompanyFilterSettings
      tags: [profile]
      summary: Update company filter settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyFilterSettings"
      responses:
        "200":
          description: Updated company filter settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyFilterSettings"

  /title-exclude-settings:
    get:
      operationId: getTitleExcludeSettings
      tags: [profile]
      summary: Get title exclude keyword settings
      responses:
        "200":
          description: Title exclude settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleExcludeSettings"
    put:
      operationId: updateTitleExcludeSettings
      tags: [profile]
      summary: Update title exclude keyword settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TitleExcludeSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleExcludeSettings"

  /profile/parse-resume:
    post:
      operationId: parseResume
      tags: [profile]
      summary: Parse resume and extract experience history
      responses:
        "200":
          description: Parsed experience entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  experienceHistory:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExperienceEntry"
                required: [experienceHistory]
        "400":
          description: No resume found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Could not parse resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /imap/status:
    get:
      operationId: getImapStatus
      tags: [imap]
      summary: Get IMAP connection status
      responses:
        "200":
          description: IMAP connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImapStatus"

  /imap/connect:
    post:
      operationId: connectImap
      tags: [imap]
      summary: Connect an IMAP account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectImapBody"
      responses:
        "200":
          description: IMAP connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImapConnected"
        "400":
          description: Missing required fields
        "422":
          description: Connection failed

  /imap/disconnect:
    delete:
      operationId: disconnectImap
      tags: [imap]
      summary: Disconnect IMAP account
      responses:
        "200":
          description: Disconnected

  /imap/sync:
    post:
      operationId: syncImap
      tags: [imap]
      summary: Trigger a manual IMAP sync
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImapSyncResult"
        "400":
          description: No IMAP connection configured

  /gmail/connect:
    get:
      operationId: connectGmail
      tags: [gmail]
      summary: Initiate Gmail OAuth flow (redirects to Google)
      responses:
        "302":
          description: Redirect to Google OAuth consent screen

  /gmail/callback:
    get:
      operationId: gmailCallback
      tags: [gmail]
      summary: OAuth callback from Google (redirects to frontend)
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to frontend with gmail=connected or gmail=error

  /gmail/status:
    get:
      operationId: getGmailStatus
      tags: [gmail]
      summary: Get Gmail connection status
      responses:
        "200":
          description: Gmail connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailStatus"

  /gmail/disconnect:
    delete:
      operationId: disconnectGmail
      tags: [gmail]
      summary: Disconnect Gmail account
      responses:
        "204":
          description: Disconnected

  /gmail/sync:
    post:
      operationId: syncGmail
      tags: [gmail]
      summary: Trigger a manual Gmail sync
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmailSyncResult"
        "400":
          description: Gmail not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ImportSummary:
      type: object
      properties:
        imported:
          type: integer
          description: Number of rows successfully imported
        skipped:
          type: integer
          description: Number of rows skipped as duplicates
        invalid:
          type: integer
          description: Number of rows skipped due to missing required fields
      required:
        - imported
        - skipped
        - invalid

    UserProfile:
      type: object
      properties:
        userId:
          type: string
        skills:
          type: array
          items:
            type: string
        experienceHistory:
          type: array
          items:
            $ref: "#/components/schemas/ExperienceEntry"
        education:
          type: ["string", "null"]
        targetSalary:
          type: ["integer", "null"]
        remotePreference:
          type: string
        remotePreferences:
          type: array
          items:
            type: string
        locationPreferences:
          type: array
          items:
            type: string
        resumeUrl:
          type: ["string", "null"]
        resumeText:
          type: ["string", "null"]
        syncScheduleHours:
          type: ["integer", "null"]
        onlineDiscoveryScheduleHours:
          type: ["number", "null"]
        onlineDiscoveryMinMatchScore:
          type: integer
        lastOnlineDiscoveryAt:
          type: ["string", "null"]
          format: date-time
        lastOnlineDiscoveryFound:
          type: integer
        lastOnlineDiscoveryImported:
          type: integer
        lastOnlineDiscoveryDuplicates:
          type: integer
        lastOnlineDiscoveryError:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - userId
        - skills
        - experienceHistory
        - remotePreference
        - createdAt
        - updatedAt

    ExperienceEntry:
      type: object
      properties:
        title:
          type: string
        company:
          type: string
        startYear:
          type: integer
        endYear:
          type: ["integer", "null"]
        description:
          type: string
      required:
        - title
        - company
        - startYear
        - description

    UpsertProfileBody:
      type: object
      properties:
        skills:
          type: array
          items:
            type: string
        experienceHistory:
          type: array
          items:
            $ref: "#/components/schemas/ExperienceEntry"
        education:
          type: ["string", "null"]
        targetSalary:
          type: ["integer", "null"]
        remotePreference:
          type: string
        remotePreferences:
          type: array
          items:
            type: string
        locationPreferences:
          type: array
          items:
            type: string
        resumeUrl:
          type: ["string", "null"]
        resumeText:
          type: ["string", "null"]
        syncScheduleHours:
          type: ["integer", "null"]
        onlineDiscoveryScheduleHours:
          type: ["number", "null"]
        onlineDiscoveryMinMatchScore:
          type: integer

    JobPosting:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        company:
          type: string
        link:
          type: ["string", "null"]
        fullDescription:
          type: string
        extractedSkills:
          type: array
          items:
            type: string
        salaryMin:
          type: ["integer", "null"]
        salaryMax:
          type: ["integer", "null"]
        source:
          type: string
        sourcePostedAt:
          type: ["string", "null"]
          format: date-time
        gmailMessageId:
          type: ["string", "null"]
        senderName:
          type: ["string", "null"]
        appliedAt:
          type: ["string", "null"]
          format: date-time
        location:
          type: ["string", "null"]
        remoteType:
          type: ["string", "null"]
        deletedAt:
          type: ["string", "null"]
          format: date-time
        deletedBy:
          type: ["string", "null"]
        closedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - company
