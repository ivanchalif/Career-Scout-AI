kind = "web"
previewPath = "/"
title = "Career Scout"
version = "1.0.0"
id = "artifacts/career-scout"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23654

[services.development]
run = "pnpm --filter @workspace/career-scout run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/career-scout", "run", "build" ]
publicDir = "artifacts/career-scout/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23654"
BASE_PATH = "/"
